name: Build distributions

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release --bins
      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist/tangdou-downloader-linux-x86_64
          cp target/release/tangdou-downloader target/release/tangdou-cli README.md LICENSE dist/tangdou-downloader-linux-x86_64/
          tar -czf dist/tangdou-downloader-linux-x86_64.tar.gz -C dist tangdou-downloader-linux-x86_64
          cd dist
          sha256sum tangdou-downloader-linux-x86_64.tar.gz > linux-SHA256SUMS.txt
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/tangdou-downloader-windows-x86_64
          Copy-Item target/release/tangdou-downloader.exe,target/release/tangdou-cli.exe,README.md,LICENSE dist/tangdou-downloader-windows-x86_64/
          Compress-Archive -Path dist/tangdou-downloader-windows-x86_64 -DestinationPath dist/tangdou-downloader-windows-x86_64.zip
          $hash = (Get-FileHash dist/tangdou-downloader-windows-x86_64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  tangdou-downloader-windows-x86_64.zip" | Set-Content dist/windows-SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: tangdou-downloader-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*SHA256SUMS.txt
          if-no-files-found: error
